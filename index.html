<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Navigation Tabs -->
        <nav class="flex gap-8 border-b border-white/5 mb-8">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="pb-4 text-sm font-bold transition-all tab-active">Dashboard</button>
            <button onclick="switchTab('goals')" id="tab-goals" class="pb-4 text-sm font-bold text-slate-500 hover:text-white transition-all">Yearly Goals</button>
        </nav>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard">
            <header class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-6">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tighter">Daily Ops</h1>
                    <p class="text-slate-500 font-medium">Habit Statistics &amp; Performance</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="downloadSelf()" class="bg-transparent hover:bg-white/5 text-slate-400 px-4 py-2 rounded-xl font-medium flex items-center gap-2 border border-white/10 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                        Export
                    </button>
                    <button onclick="toggleArchiveView()" id="archiveToggleBtn" class="bg-transparent hover:bg-white/5 text-slate-400 px-4 py-2 rounded-xl font-medium border border-white/10 transition-all">
                        Show Archived
                    </button>
                    <button onclick="openModal('addHabitModal')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-indigo-500/10 transition-all">
                        + New Habit
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
                <!-- Analytics Column -->
                <div class="space-y-6">
                    <div class="bg-amoled-card p-6 rounded-[2rem] border border-amoled shadow-2xl">
                        <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-3">Overall Pace</h3>
                        <div class="flex items-baseline gap-2">
                            <span id="yearlyPace" class="text-5xl font-black text-white">0%</span>
                            <span id="consistencyMetric" class="hidden">0.0</span>
                        </div>
                        <div class="w-full bg-white/5 h-2 rounded-full mt-6 overflow-hidden">
                            <div id="paceBar" class="bg-indigo-500 h-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                        <p id="paceStatus" class="text-xs mt-5 text-slate-500 font-medium italic">Trajectory: Variable</p>
                    </div>

                    <div class="bg-amoled-card p-6 rounded-[2rem] border border-amoled shadow-2xl">
                        <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-2">Session Date</h3>
                        <div id="formattedDisplayDate" class="text-2xl font-black text-indigo-500 mb-4 font-mono tracking-tighter">2026/03/28</div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeDate(-1)" class="date-btn p-3 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 text-slate-300 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <div class="relative flex-1">
                                <input type="date" id="datePicker" onchange="updateView()" class="bg-white/5 text-white w-full px-4 py-3 rounded-2xl border border-white/5 opacity-0 absolute inset-0 z-10 cursor-pointer">
                                <div class="bg-white/5 text-slate-500 w-full px-4 py-3 rounded-2xl border border-white/5 text-sm font-bold flex items-center justify-between">
                                    <span>Calendar</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z"></path></svg>
                                </div>
                            </div>
                            <button onclick="changeDate(1)" class="date-btn p-3 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 text-slate-300 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Focus Timer -->
                <div class="bg-amoled-card p-8 rounded-[2rem] border border-amoled shadow-2xl flex flex-col items-center justify-center text-center">
                    <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-6">Focus Timer</h3>
                    <div id="timerDisplay" class="text-7xl font-black text-white mb-8 font-mono tracking-tighter">25:00</div>
                    <div class="flex gap-4 w-full">
                        <button id="timerBtn" onclick="toggleTimer()" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-500 transition-all">Start</button>
                        <button onclick="resetTimer()" class="p-4 bg-white/5 text-slate-500 rounded-2xl hover:text-white transition-all border border-white/5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Task List -->
                <div class="bg-amoled-card p-6 rounded-[2rem] border border-amoled shadow-2xl flex flex-col">
                    <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-4">Daily Tasks</h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="taskInput" placeholder="Quick task..." class="bg-white/5 flex-1 px-4 py-3 rounded-xl border border-white/10 text-white text-sm outline-none focus:border-indigo-500/50 transition-all">
                        <button onclick="addTask()" class="p-3 bg-white text-black rounded-xl hover:bg-slate-200 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>
                    <div id="taskList" class="space-y-2 overflow-y-auto custom-scroll flex-1 pr-2 max-h-[180px]"><p class="text-slate-800 text-xs text-center py-4">No pending tasks</p></div>
                </div>
            </div>

            <div id="habitsContainer" class="habit-grid"><div class="col-span-full py-24 text-center text-slate-700 border border-white/5 rounded-[2rem]">No active entries for this date.</div></div>
        </div>

        <!-- GOALS VIEW -->
        <div id="view-goals" class="hidden">
            <header class="flex items-center justify-between mb-10">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tighter">Yearly Goals</h1>
                    <p class="text-slate-500 font-medium">Big Picture Objectives</p>
                </div>
                <button onclick="openModal('addGoalModal')" class="bg-white text-black px-6 py-2 rounded-xl font-bold transition-all hover:bg-slate-200">
                    + New Goal
                </button>
            </header>

            <div id="goalsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="addHabitModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 id="modalTitle" class="text-3xl font-black text-white mb-8 tracking-tighter">New Habit</h2>
            <input type="hidden" id="editHabitId">
            <div class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Label</label>
                    <input type="text" id="habitNameInput" placeholder="E.g. Meditation" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Starting From</label>
                    <div id="formattedStartDateDisplay" class="text-2xl font-black text-indigo-500 mb-4 font-mono tracking-tighter">2024/01/01</div>
                    <div class="relative">
                        <input type="date" id="habitStartDate" onchange="syncModalDateLabel()" class="bg-white/5 text-white w-full px-4 py-4 rounded-2xl border border-white/5 opacity-0 absolute inset-0 z-10 cursor-pointer">
                        <div class="bg-white/5 text-slate-500 w-full px-5 py-4 rounded-2xl border border-white/5 text-sm font-bold flex items-center justify-between transition-all hover:bg-white/10">
                            <span>Calendar</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z"></path></svg>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4">Target Schedule</label>
                    <div id="daysContainer" class="flex flex-wrap gap-2"><button id="day-btn-0" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Mon</button><button id="day-btn-1" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Tue</button><button id="day-btn-2" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Wed</button><button id="day-btn-3" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Thu</button><button id="day-btn-4" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Fri</button><button id="day-btn-5" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Sat</button><button id="day-btn-6" class="day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all">Sun</button></div>
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="closeModal('addHabitModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button id="saveHabitBtn" onclick="saveHabit()" class="flex-1 px-5 py-4 rounded-2xl bg-white text-black font-black hover:bg-slate-200 transition-all shadow-xl">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Goal Modal -->
    <div id="addGoalModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 class="text-3xl font-black text-white mb-8 tracking-tighter">Yearly Objective</h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Goal Title</label>
                    <input type="text" id="goalTitleInput" placeholder="E.g. Run a Marathon" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Category</label>
                    <select id="goalCategory" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white outline-none">
                        <option value="Health">Health</option>
                        <option value="Wealth">Wealth</option>
                        <option value="Growth">Growth</option>
                        <option value="Social">Social</option>
                    </select>
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="closeModal('addGoalModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button onclick="saveGoal()" class="flex-1 px-5 py-4 rounded-2xl bg-indigo-600 text-white font-black hover:bg-indigo-500 transition-all shadow-xl">Add Goal</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let habits = JSON.parse(localStorage.getItem('habitStats_v2_habits')) || [];
        let logs = JSON.parse(localStorage.getItem('habitStats_v2_logs')) || {};
        let tasks = JSON.parse(localStorage.getItem('habitStats_v2_tasks')) || [];
        let goals = JSON.parse(localStorage.getItem('habitStats_v2_goals')) || [];
        let showArchived = false;
        const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        let selectedDays = [0, 1, 2, 3, 4, 5, 6]; 

        let timerSeconds = 1500;
        let timerInterval = null;

        window.onload = () => {
            const dp = document.getElementById('datePicker');
            if (dp) dp.valueAsDate = new Date();
            
            const daysContainer = document.getElementById('daysContainer');
            if (daysContainer) {
                dayLabels.forEach((label, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `day-btn-${idx}`;
                    btn.className = "day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all";
                    btn.innerText = label;
                    btn.onclick = () => toggleDaySelection(idx);
                    daysContainer.appendChild(btn);
                });
            }

            updateView();
            renderTasks();
            renderGoals();
        };

        // --- Navigation ---
        function switchTab(tab) {
            document.getElementById('view-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('view-goals').classList.toggle('hidden', tab !== 'goals');
            
            document.getElementById('tab-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            document.getElementById('tab-dashboard').classList.toggle('text-slate-500', tab !== 'dashboard');
            
            document.getElementById('tab-goals').classList.toggle('tab-active', tab === 'goals');
            document.getElementById('tab-goals').classList.toggle('text-slate-500', tab !== 'goals');
        }

        // --- Goal Management ---
        function saveGoal() {
            const title = document.getElementById('goalTitleInput').value;
            const category = document.getElementById('goalCategory').value;
            if (!title) return;

            goals.push({
                id: Date.now(),
                title,
                category,
                progress: 0,
                completed: false
            });

            localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
            renderGoals();
            closeModal('addGoalModal');
            document.getElementById('goalTitleInput').value = '';
        }

        function updateGoalProgress(id, amount) {
            goals = goals.map(g => {
                if (g.id === id) {
                    const newProg = Math.min(100, Math.max(0, g.progress + amount));
                    return { ...g, progress: newProg, completed: newProg === 100 };
                }
                return g;
            });
            localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
            renderGoals();
        }

        function deleteGoal(id) {
            if (confirm('Delete this goal?')) {
                goals = goals.filter(g => g.id !== id);
                localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
                renderGoals();
            }
        }

        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            if (!container) return;
            container.innerHTML = '';

            goals.forEach(goal => {
                const card = document.createElement('div');
                card.className = "bg-amoled-card p-8 rounded-[2.5rem] border border-amoled shadow-2xl relative overflow-hidden group";
                card.innerHTML = `
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">${goal.category}</span>
                            <button onclick="deleteGoal(${goal.id})" class="opacity-0 group-hover:opacity-100 text-slate-800 hover:text-red-500 transition-all">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <h3 class="text-2xl font-black text-white mb-6 leading-tight">${goal.title}</h3>
                        
                        <div class="space-y-4">
                            <div class="flex justify-between items-end">
                                <span class="text-[10px] font-black text-slate-600 uppercase">Progress</span>
                                <span class="text-xl font-black text-white">${goal.progress}%</span>
                            </div>
                            <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full transition-all duration-500" style="width: ${goal.progress}%"></div>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button onclick="updateGoalProgress(${goal.id}, -10)" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-white font-bold text-xs">-10%</button>
                                <button onclick="updateGoalProgress(${goal.id}, 10)" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">+10%</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Existing Dashboard Functions (Restored) ---
        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            const el = document.getElementById('timerDisplay');
            if (el) el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (!btn) return;

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "Start";
                btn.className = "flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest transition-all";
            } else {
                btn.innerText = "Pause";
                btn.className = "flex-1 py-4 bg-white/10 text-white border border-white/20 rounded-2xl font-black text-sm uppercase tracking-widest transition-all";
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 1500;
            const btn = document.getElementById('timerBtn');
            if (btn) {
                btn.innerText = "Start";
                btn.className = "flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest transition-all";
            }
            updateTimerDisplay();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input || !input.value.trim()) return;
            tasks.push({ id: Date.now(), text: input.value, done: false });
            input.value = "";
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            if (!container) return;
            container.innerHTML = tasks.length ? '' : '<p class="text-slate-800 text-xs text-center py-4">No pending tasks</p>';
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = "group flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5 hover:border-white/10 transition-all";
                div.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer" onclick="toggleTask(${task.id})">
                        <div class="w-5 h-5 rounded-md border-2 ${task.done ? 'bg-indigo-500 border-indigo-500' : 'border-white/10'} flex items-center justify-center transition-all">
                            ${task.done ? '<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg>' : ''}
                        </div>
                        <span class="text-sm font-medium ${task.done ? 'text-slate-600 line-through' : 'text-slate-300'}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-700 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function saveTasks() { localStorage.setItem('habitStats_v2_tasks', JSON.stringify(tasks)); }

        function formatDate(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "YYYY/MM/DD";
            return `${dateObj.getFullYear()}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function syncModalDateLabel() {
            const input = document.getElementById('habitStartDate');
            const display = document.getElementById('formattedStartDateDisplay');
            if (input && display && input.value) {
                const [y, m, d] = input.value.split('-');
                display.innerText = `${y}/${m}/${d}`;
            }
        }

        function changeDate(days) {
            const dp = document.getElementById('datePicker');
            if (!dp) return;
            const current = new Date(dp.value);
            current.setDate(current.getDate() + days);
            dp.valueAsDate = current;
            updateView();
        }

        function toggleDaySelection(dayIdx) {
            selectedDays = selectedDays.includes(dayIdx) ? selectedDays.filter(d => d !== dayIdx) : [...selectedDays, dayIdx];
            refreshDayButtons();
        }

        function refreshDayButtons() {
            dayLabels.forEach((_, idx) => {
                const btn = document.getElementById(`day-btn-${idx}`);
                if (btn) {
                    btn.className = selectedDays.includes(idx) 
                        ? "day-toggle px-4 py-2.5 rounded-xl border border-indigo-500/50 bg-indigo-500/10 text-indigo-400 text-[11px] font-black transition-all"
                        : "day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all";
                }
            });
        }

        function openModal(id, habitId = null) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            if (id === 'addHabitModal') {
                const dateInput = document.getElementById('habitStartDate');
                const nameInput = document.getElementById('habitNameInput');
                const editIdInput = document.getElementById('editHabitId');
                const titleEl = document.getElementById('modalTitle');
                const saveBtn = document.getElementById('saveHabitBtn');

                if (habitId) {
                    const h = habits.find(h => h.id === habitId);
                    if (titleEl) titleEl.innerText = "Configure Habit";
                    if (nameInput) nameInput.value = h.name;
                    if (dateInput) dateInput.value = h.startDate;
                    if (editIdInput) editIdInput.value = h.id;
                    if (saveBtn) saveBtn.innerText = "Update";
                    selectedDays = [...h.activeDays];
                } else {
                    if (titleEl) titleEl.innerText = "New Habit";
                    if (nameInput) nameInput.value = "";
                    if (dateInput) dateInput.valueAsDate = new Date();
                    if (editIdInput) editIdInput.value = "";
                    if (saveBtn) saveBtn.innerText = "Create";
                    selectedDays = [0,1,2,3,4,5,6];
                }
                syncModalDateLabel();
                refreshDayButtons();
            }
        }

        function saveHabit() {
            const name = document.getElementById('habitNameInput')?.value;
            const startDate = document.getElementById('habitStartDate')?.value;
            const editId = document.getElementById('editHabitId')?.value;
            if (!name || !startDate) return;
            if (editId) {
                const idx = habits.findIndex(h => h.id === editId);
                habits[idx] = { ...habits[idx], name, startDate, activeDays: [...selectedDays] };
            } else {
                habits.push({ id: Date.now().toString(), name, startDate, activeDays: [...selectedDays], archived: false });
            }
            saveData();
            updateView();
            closeModal('addHabitModal');
        }

        function deleteHabit(id) {
            if (confirm('Delete this habit?')) {
                habits = habits.filter(h => h.id !== id);
                saveData();
                updateView();
            }
        }

        function toggleHabitLog(id) {
            const dp = document.getElementById('datePicker');
            if (!dp) return;
            const ds = dp.value.replace(/-/g, '/');
            if (!logs[ds]) logs[ds] = {};
            logs[ds][id] = !logs[ds][id];
            saveData();
            updateView();
        }

        function saveData() {
            localStorage.setItem('habitStats_v2_habits', JSON.stringify(habits));
            localStorage.setItem('habitStats_v2_logs', JSON.stringify(logs));
        }

        function getStats(habit) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const [y, m, d] = habit.startDate.split('-').map(Number);
            const habitStart = new Date(y, m-1, d);
            let targetCount = 0, actualDone = 0;
            const iter = new Date(habitStart);
            while (iter <= today) {
                const dIdx = (iter.getDay() + 6) % 7;
                if (habit.activeDays.includes(dIdx)) {
                    targetCount++;
                    const ds = `${iter.getFullYear()}/${String(iter.getMonth()+1).padStart(2,'0')}/${String(iter.getDate()).padStart(2,'0')}`;
                    if (logs[ds]?.[habit.id]) actualDone++;
                }
                iter.setDate(iter.getDate() + 1);
            }
            return {
                pace: targetCount > 0 ? ((actualDone / targetCount) * 100).toFixed(1) : "0.0",
                total: actualDone
            };
        }

        function updateView() {
            const container = document.getElementById('habitsContainer');
            const dp = document.getElementById('datePicker');
            if (!container || !dp) return;

            const dateInput = dp.value;
            const dateStr = dateInput.replace(/-/g, '/');
            const [sy, sm, sd] = dateInput.split('-').map(Number);
            const sessionDate = new Date(sy, sm-1, sd);
            const sessionDayIdx = (sessionDate.getDay() + 6) % 7;

            const displayDateEl = document.getElementById('formattedDisplayDate');
            if (displayDateEl) displayDateEl.innerText = formatDate(sessionDate);
            
            container.innerHTML = '';

            const filtered = habits.filter(h => {
                const [hy, hm, hd] = h.startDate.split('-').map(Number);
                const hStart = new Date(hy, hm-1, hd);
                return (showArchived ? h.archived : !h.archived) && sessionDate >= hStart;
            });
            
            if (!filtered.length) {
                container.innerHTML = `<div class="col-span-full py-24 text-center text-slate-700 border border-white/5 rounded-[2rem]">No active entries for this date.</div>`;
            }

            filtered.forEach(h => {
                const stats = getStats(h);
                const isLogged = logs[dateStr]?.[h.id];
                const isScheduledToday = h.activeDays.includes(sessionDayIdx);
                const card = document.createElement('div');
                card.className = `bg-amoled-card p-6 rounded-[2rem] border ${isLogged ? 'border-indigo-500/50' : 'border-amoled'} group transition-all`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="font-black text-xl text-white tracking-tight">${h.name}</h3>
                            <div class="flex gap-1 mt-2">${dayLabels.map((l, i) => `<span class="text-[9px] px-1.5 py-0.5 rounded-md ${h.activeDays.includes(i) ? 'bg-white/10 text-white' : 'text-slate-800'}">${l[0]}</span>`).join('')}</div>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openModal('addHabitModal', '${h.id}')" class="p-2 text-slate-700 hover:text-white"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            <button onclick="deleteHabit('${h.id}')" class="p-2 text-slate-700 hover:text-red-500"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6h14zM8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                        </div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-3xl text-center mb-6">
                        <p class="text-[8px] text-slate-600 uppercase font-black tracking-widest mb-1">Lifetime Pace</p>
                        <p class="text-xl font-black text-white">${stats.pace}%</p>
                    </div>
                    <button onclick="toggleHabitLog('${h.id}')" class="w-full py-5 rounded-2xl border font-black text-xs uppercase tracking-widest ${isLogged ? 'bg-white text-black' : isScheduledToday ? 'border-white/10 text-slate-400 hover:border-white/30' : 'border-white/5 text-slate-800'} transition-all">
                        ${isLogged ? 'Active' : isScheduledToday ? 'Mark Done' : 'Off-Schedule'}
                    </button>
                `;
                container.appendChild(card);
            });

            const activeH = habits.filter(h => !h.archived);
            const avgPace = activeH.length ? (activeH.reduce((acc, h) => acc + parseFloat(getStats(h).pace), 0) / activeH.length).toFixed(1) : 0;
            
            const paceEl = document.getElementById('yearlyPace');
            const paceBar = document.getElementById('paceBar');
            const statusEl = document.getElementById('paceStatus');
            const consEl = document.getElementById('consistencyMetric');

            if (paceEl) paceEl.innerText = avgPace + '%';
            if (paceBar) paceBar.style.width = avgPace + '%';
            if (statusEl) statusEl.innerText = avgPace >= 80 ? "Trajectory: Optimized" : "Trajectory: Variable";
        }

        function toggleArchiveView() {
            showArchived = !showArchived;
            const btn = document.getElementById('archiveToggleBtn');
            if (btn) btn.innerText = showArchived ? "Show Active" : "Show Archived";
            updateView();
        }

        function closeModal(id) { 
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden'); 
        }

        function downloadSelf() {
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Dashboard_Export_${new Date().toISOString().split('T')[0]}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>

</body></html>
