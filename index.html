<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link id="favicon" rel="icon" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-amoled: #000000;
            --card-amoled: #0a0a0a;
            --border-amoled: #1a1a1a;
        }
        body {
            background-color: var(--bg-amoled);
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            overflow-x: hidden;
        }
        .habit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        .date-btn:active { transform: scale(0.9); }
        .bg-amoled-card { background-color: var(--card-amoled); }
        .border-amoled { border-color: var(--border-amoled); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        
        .tab-active { color: white; border-bottom: 2px solid #4f46e5; }
        
        /* Sidebar specific height adjustment */
        .sidebar-height {
            height: calc(100vh - 240px);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-[1600px] mx-auto">
        <!-- Navigation Tabs -->
        <nav class="flex gap-8 border-b border-white/5 mb-8">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="pb-4 text-sm font-bold transition-all tab-active">Dashboard</button>
            <button onclick="switchTab('goals')" id="tab-goals" class="pb-4 text-sm font-bold text-slate-500 hover:text-white transition-all"><span id="yearly-tab-title">2026 Goals</span></button>
        </nav>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard">
            <header class="flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6">
                <div class="flex flex-col md:flex-row md:items-center gap-6 flex-1">
                    <div>
                        <h1 class="text-4xl font-black text-white tracking-tighter">Dashboard</h1>
                    </div>

                    <!-- Actions Bar Container -->
                    <div class="flex wrap items-center gap-3 flex-1">
                        <!-- Mini Session Date -->
                        <div class="bg-amoled-card px-4 py-2 rounded-2xl border border-amoled flex items-center gap-4">
                            <div class="flex flex-col">
                                <span class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Date</span>
                                <span id="formattedDisplayDate" class="text-sm font-black text-indigo-500 font-mono">2026/01/01</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="changeDate(-1)" class="date-btn p-1.5 hover:bg-white/5 rounded-lg text-slate-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
                                </button>
                                <div class="relative">
                                    <input type="date" id="datePicker" onchange="updateView()" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z" /></svg>
                                </div>
                                <button onclick="changeDate(1)" class="date-btn p-1.5 hover:bg-white/5 rounded-lg text-slate-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Mini Focus Timer -->
                        <div class="bg-amoled-card px-4 py-2 rounded-2xl border border-amoled flex items-center gap-4">
                            <div class="flex flex-col">
                                <span class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Timer</span>
                                <span id="timerDisplay" class="text-sm font-black text-white font-mono">25:00</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button id="timerBtn" onclick="toggleTimer()" class="p-1.5 bg-indigo-600/20 text-indigo-400 rounded-lg text-[10px] font-black uppercase tracking-tighter px-3">Start</button>
                                <button onclick="resetTimer()" class="p-1.5 hover:bg-white/5 rounded-lg text-slate-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Action Buttons and Year Progress - Pushed to Right -->
                        <div class="flex items-center gap-3 lg:ml-auto">
                            <!-- Year Progress Bar -->
                            <div class="hidden sm:flex bg-amoled-card px-4 py-2 rounded-2xl border border-amoled flex-col justify-center min-w-[140px] h-[42px]">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[7px] font-black text-slate-600 uppercase tracking-widest" id="yearLabel">Year Progress</span>
                                    <span class="text-[9px] font-black text-indigo-400 font-mono" id="yearPercent">0%</span>
                                </div>
                                <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                                    <div id="yearProgressBar" class="bg-indigo-500 h-full transition-all duration-1000" style="width: 0%"></div>
                                </div>
                            </div>

                            <button onclick="downloadSelf()" title="Export Data" class="bg-transparent hover:bg-white/5 text-slate-400 p-2.5 rounded-xl border border-white/10 transition-all h-[42px] flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            </button>
                            <button onclick="toggleArchiveView()" id="archiveToggleBtn" class="bg-transparent hover:bg-white/5 text-slate-400 px-4 rounded-xl text-xs font-bold border border-white/10 transition-all h-[42px] uppercase tracking-tighter">
                                Archive
                            </button>
                            <!-- CIRCULAR NEW BUTTON -->
                            <button onclick="openModal('addHabitModal')" title="New Habit" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-full w-[42px] h-[42px] flex items-center justify-center shadow-lg shadow-indigo-500/10 transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-8 items-start min-h-0">
                <!-- Habit Section (Left) -->
                <div id="habitsContainer" class="habit-grid flex-1">
                    <!-- Habit cards injected here -->
                </div>

                <!-- Quick Tasks Sidebar (Right) -->
                <div class="w-full lg:w-80 flex-shrink-0 sticky top-8">
                    <div class="bg-amoled-card p-6 rounded-[2rem] border border-amoled shadow-2xl flex flex-col sidebar-height">
                        <div class="flex flex-col mb-6">
                            <h3 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-4">Quick Tasks</h3>
                            <div class="flex gap-2 w-full">
                                <input type="text" id="taskInput" placeholder="Add task..." class="bg-white/5 flex-1 px-4 py-3 rounded-xl border border-white/10 text-white text-sm outline-none focus:border-indigo-500/50 transition-all">
                                <button onclick="addTask()" class="p-3 bg-white text-black rounded-xl hover:bg-slate-200 transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"/></svg>
                                </button>
                            </div>
                        </div>
                        <div id="taskList" class="flex-1 overflow-y-auto custom-scroll space-y-3 pr-2">
                            <!-- Tasks injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GOALS VIEW -->
        <div id="view-goals" class="hidden">
            <header class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-4">
                    <h1 class="text-4xl font-black text-white tracking-tighter" id="yearly-heading-title">2026 Goals</h1>
                    <button onclick="openModal('renameTabModal')" class="p-2 hover:bg-white/5 rounded-xl text-slate-500 hover:text-white transition-all" title="Rename tab category">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
                    </button>
                </div>
                <button onclick="openModal('addGoalModal')" class="bg-white text-black px-6 py-2 rounded-xl font-bold transition-all hover:bg-slate-200">
                    + New Goal
                </button>
            </header>

            <div id="goalsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Goals injected here -->
            </div>

            <!-- Notes Section in Goals Tab (Bottom) -->
            <div class="mt-16 border-t border-white/5 pt-12 pb-16">
                <div class="flex justify-end mb-6">
                    <button onclick="openNoteModal()" class="bg-white text-black px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all uppercase tracking-wider flex items-center gap-1.5 shadow-lg">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"/></svg>
                        Note
                    </button>
                </div>

                <!-- Notes list grid -->
                <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Notes injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal (Replaces browser confirm) -->
    <div id="confirmModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-[100]">
        <div class="bg-black rounded-[2rem] p-8 w-full max-w-sm shadow-2xl border border-white/10 text-center">
            <h3 class="text-xl font-black text-white mb-2" id="confirmTitle">Are you sure?</h3>
            <p class="text-sm text-slate-400 mb-6" id="confirmMessage">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 rounded-xl border border-white/10 text-slate-400 font-bold hover:bg-white/5 transition-all text-sm">Cancel</button>
                <button id="confirmYesBtn" onclick="executeConfirm()" class="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-black transition-all text-sm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Habit Modal -->
    <div id="addHabitModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 id="modalTitle" class="text-3xl font-black text-white mb-8 tracking-tighter">New Habit</h2>
            <input type="hidden" id="editHabitId">
            <div class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Label</label>
                    <input type="text" id="habitNameInput" placeholder="E.g. Meditation" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Starting From</label>
                    <div id="formattedStartDateDisplay" class="text-2xl font-black text-indigo-500 mb-4 font-mono tracking-tighter">2026/01/01</div>
                    <div class="relative">
                        <input type="date" id="habitStartDate" onchange="syncModalDateLabel()" class="bg-white/5 text-white w-full px-4 py-4 rounded-2xl border border-white/5 opacity-0 absolute inset-0 z-10 cursor-pointer">
                        <div class="bg-white/5 text-slate-500 w-full px-5 py-4 rounded-2xl border border-white/5 text-sm font-bold flex items-center justify-between transition-all hover:bg-white/10">
                            <span>Calendar</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z" /></svg>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4">Target Schedule</label>
                    <div id="daysContainer" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="closeModal('addHabitModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button id="saveHabitBtn" onclick="saveHabit()" class="flex-1 px-5 py-4 rounded-2xl bg-white text-black font-black hover:bg-slate-200 transition-all shadow-xl">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Tab Modal -->
    <div id="renameTabModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 class="text-3xl font-black text-white mb-8 tracking-tighter">Rename Goals Tab</h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Custom Title</label>
                    <input type="text" id="customGoalsTitleInput" placeholder="E.g. 2026 Goals, Vision, Bucket List" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white outline-none">
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="closeModal('renameTabModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button onclick="saveCustomGoalsTitle()" class="flex-1 px-5 py-4 rounded-2xl bg-indigo-600 text-white font-black hover:bg-indigo-500 transition-all shadow-xl">Rename</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Yearly Goal Modal -->
    <div id="addGoalModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 id="goalModalTitle" class="text-3xl font-black text-white mb-8 tracking-tighter">Yearly Objective</h2>
            <input type="hidden" id="editGoalId">
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Goal Title</label>
                    <input type="text" id="goalTitleInput" placeholder="E.g. Run a Marathon" class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Description / Note</label>
                    <textarea id="goalDescriptionInput" placeholder="E.g. Complete in under 4 hours, run 3x per week..." class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white outline-none resize-none h-24 text-sm focus:ring-1 focus:ring-indigo-500 transition-all"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Category</label>
                    <div class="flex gap-2">
                        <input type="text" id="goalCategory" placeholder="E.g. Fitness" class="bg-white/5 flex-1 px-5 py-4 rounded-2xl border border-white/10 text-white outline-none">
                        <select id="goalCategorySelect" onchange="document.getElementById('goalCategory').value = this.value" class="bg-[#0a0a0a] px-3 py-4 rounded-2xl border border-white/10 text-white outline-none">
                            <option value="">Custom...</option>
                            <option value="Health">Health</option>
                            <option value="Wealth">Wealth</option>
                            <option value="Growth">Growth</option>
                            <option value="Social">Social</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 mt-10">
                    <button onclick="closeModal('addGoalModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button id="saveGoalBtn" onclick="saveGoal()" class="flex-1 px-5 py-4 rounded-2xl bg-indigo-600 text-white font-black hover:bg-indigo-500 transition-all shadow-xl">Add Goal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="noteModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="bg-black rounded-[2.5rem] p-10 w-full max-w-lg shadow-2xl border border-white/10">
            <h2 id="noteModalTitle" class="text-3xl font-black text-white mb-8 tracking-tighter">New Note</h2>
            <input type="hidden" id="editNoteId">
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-600 uppercase tracking-widest mb-3">Your Note</label>
                    <textarea id="noteInput" placeholder="Write a short note..." class="bg-white/5 w-full px-5 py-4 rounded-2xl border border-white/10 text-white text-sm outline-none focus:ring-1 focus:ring-indigo-500 transition-all resize-none h-32 custom-scroll"></textarea>
                </div>
                <div class="flex gap-4 mt-4">
                    <button onclick="closeModal('noteModal')" class="flex-1 px-5 py-4 rounded-2xl border border-white/10 text-slate-500 font-bold hover:bg-white/5 transition-all">Cancel</button>
                    <button id="saveNoteBtn" onclick="saveNote()" class="flex-1 px-5 py-4 rounded-2xl bg-indigo-600 text-white font-black hover:bg-indigo-500 transition-all shadow-xl">Save Note</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let habits = JSON.parse(localStorage.getItem('habitStats_v2_habits')) || [];
        let logs = JSON.parse(localStorage.getItem('habitStats_v2_logs')) || {};
        let tasks = JSON.parse(localStorage.getItem('habitStats_v2_tasks')) || [];
        let goals = JSON.parse(localStorage.getItem('habitStats_v2_goals')) || [];
        let notes = JSON.parse(localStorage.getItem('habitStats_v2_notes')) || [];
        let customGoalsTitle = localStorage.getItem('habitStats_v2_goals_title') || `${new Date().getFullYear()} Goals`;
        let showArchived = false;
        const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        let selectedDays = [0, 1, 2, 3, 4, 5, 6]; 

        let timerSeconds = 1500;
        let timerInterval = null;
        let confirmCallback = null;

        window.onload = () => {
            generateDayFavicon();
            updateYearHeadingTitles();
            const dp = document.getElementById('datePicker');
            if (dp) dp.valueAsDate = new Date();
            
            const daysContainer = document.getElementById('daysContainer');
            if (daysContainer) {
                dayLabels.forEach((label, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `day-btn-${idx}`;
                    btn.className = "day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all";
                    btn.innerText = label;
                    btn.onclick = () => toggleDaySelection(idx);
                    daysContainer.appendChild(btn);
                });
            }

            updateYearProgress();
            updateView();
            renderTasks();
            renderGoals();
            renderNotes();
        };

        function customConfirm(title, message, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = callback;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        }

        function executeConfirm() {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        }

        function updateYearHeadingTitles() {
            const tabTitle = document.getElementById('yearly-tab-title');
            const headingTitle = document.getElementById('yearly-heading-title');
            if (tabTitle) tabTitle.innerText = customGoalsTitle;
            if (headingTitle) headingTitle.innerText = customGoalsTitle;
            
            const customTitleInput = document.getElementById('customGoalsTitleInput');
            if (customTitleInput) customTitleInput.value = customGoalsTitle;
        }

        function saveCustomGoalsTitle() {
            const input = document.getElementById('customGoalsTitleInput');
            if (input && input.value.trim() !== '') {
                customGoalsTitle = input.value.trim();
                localStorage.setItem('habitStats_v2_goals_title', customGoalsTitle);
                updateYearHeadingTitles();
                closeModal('renameTabModal');
            }
        }

        function generateDayFavicon() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const days = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            const initials = days[new Date().getDay()];
            const firstLetter = initials[0].toUpperCase();
            const secondLetter = (initials[1] || "").toLowerCase();

            // Background
            ctx.fillStyle = '#4f46e5'; 
            ctx.beginPath();
            ctx.roundRect(0, 0, 64, 64, 16);
            ctx.fill();

            // Text Setup
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Inter, system-ui, sans-serif';
            
            ctx.textBaseline = 'alphabetic';
            const fontSize = 36;
            const centerY = 32 + (fontSize * 0.35);

            if (secondLetter) {
                const firstWidth = ctx.measureText(firstLetter).width;
                const secondWidth = ctx.measureText(secondLetter).width;
                
                const totalWidth = firstWidth + secondWidth + 2;
                const startX = (64 - totalWidth) / 2;

                ctx.textAlign = 'left';
                ctx.fillText(firstLetter, startX, centerY);
                ctx.fillText(secondLetter, startX + firstWidth + 2, centerY);
            } else {
                ctx.textAlign = 'center';
                ctx.fillText(firstLetter, 32, centerY);
            }

            document.getElementById('favicon').href = canvas.toDataURL('image/png');
        }

        function updateYearProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 1);
            const end = new Date(now.getFullYear() + 1, 0, 1);
            const percent = Math.floor(((now - start) / (end - start)) * 100);
            
            const bar = document.getElementById('yearProgressBar');
            const label = document.getElementById('yearPercent');
            const yearLabel = document.getElementById('yearLabel');
            
            if (bar) bar.style.width = `${percent}%`;
            if (label) label.innerText = `${percent}%`;
            if (yearLabel) yearLabel.innerText = `${now.getFullYear()} Progress`;
        }

        function switchTab(tab) {
            document.getElementById('view-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('view-goals').classList.toggle('hidden', tab !== 'goals');
            document.getElementById('tab-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            document.getElementById('tab-dashboard').classList.toggle('text-slate-500', tab !== 'dashboard');
            document.getElementById('tab-goals').classList.toggle('tab-active', tab === 'goals');
            document.getElementById('tab-goals').classList.toggle('text-slate-500', tab !== 'goals');
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            const el = document.getElementById('timerDisplay');
            if (el) el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (!btn) return;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "Start";
            } else {
                btn.innerText = "Pause";
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 1500;
            const btn = document.getElementById('timerBtn');
            if (btn) btn.innerText = "Start";
            updateTimerDisplay();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input || !input.value.trim()) return;
            tasks.push({ id: Date.now(), text: input.value, done: false });
            input.value = "";
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            if (!container) return;
            container.innerHTML = tasks.length ? '' : '<p class="text-slate-800 text-xs py-2">No pending tasks</p>';
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 bg-white/5 p-4 rounded-xl border border-white/5 transition-all w-full";
                div.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleTask(${task.id})">
                        <div class="w-5 h-5 rounded-md border ${task.done ? 'bg-indigo-500 border-indigo-500' : 'border-white/10'} flex items-center justify-center transition-all flex-shrink-0">
                            ${task.done ? '<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg>' : ''}
                        </div>
                        <span class="text-sm font-medium leading-snug ${task.done ? 'text-slate-600 line-through' : 'text-slate-300'}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-700 hover:text-red-500 flex-shrink-0">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function saveTasks() { localStorage.setItem('habitStats_v2_tasks', JSON.stringify(tasks)); }

        function formatDate(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "YYYY/MM/DD";
            return `${dateObj.getFullYear()}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function changeDate(days) {
            const dp = document.getElementById('datePicker');
            if (!dp) return;
            const current = new Date(dp.value);
            current.setDate(current.getDate() + days);
            dp.valueAsDate = current;
            updateView();
        }

        function getYearlyCount(habitId) {
            const currentYear = new Date().getFullYear();
            let count = 0;
            for (const dateStr in logs) {
                if (dateStr.startsWith(`${currentYear}/`) && logs[dateStr][habitId]) count++;
            }
            return count;
        }

        function updateView() {
            const container = document.getElementById('habitsContainer');
            const dp = document.getElementById('datePicker');
            if (!container || !dp) return;

            const dateInput = dp.value;
            const dateStr = dateInput.replace(/-/g, '/');
            const [sy, sm, sd] = dateInput.split('-').map(Number);
            const sessionDate = new Date(sy, sm-1, sd);
            const sessionDayIdx = (sessionDate.getDay() + 6) % 7;
            const currentYear = new Date().getFullYear();

            const displayDateEl = document.getElementById('formattedDisplayDate');
            if (displayDateEl) displayDateEl.innerText = formatDate(sessionDate);
            
            container.innerHTML = '';
            const filtered = habits.filter(h => {
                const [hy, hm, hd] = h.startDate.split('-').map(Number);
                const hStart = new Date(hy, hm-1, hd);
                return (showArchived ? h.archived : !h.archived) && sessionDate >= hStart;
            });
            
            if (!filtered.length) {
                container.innerHTML = `<div class="col-span-full py-24 text-center text-slate-700 border border-white/5 rounded-[2rem]">No active entries.</div>`;
            }

            filtered.forEach(h => {
                const yearlyDone = getYearlyCount(h.id);
                const isLogged = logs[dateStr]?.[h.id];
                const isScheduledToday = h.activeDays.includes(sessionDayIdx);
                const card = document.createElement('div');
                card.className = `bg-amoled-card p-6 rounded-[2rem] border ${isLogged ? 'border-indigo-500/50' : 'border-amoled'} group transition-all`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="font-black text-xl text-white tracking-tight">${h.name}</h3>
                            <div class="flex gap-1 mt-2">${dayLabels.map((l, i) => `<span class="text-[9px] px-1.5 py-0.5 rounded-md ${h.activeDays.includes(i) ? 'bg-white/10 text-white' : 'text-slate-800'}">${l[0]}</span>`).join('')}</div>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="toggleHabitArchive('${h.id}')" class="p-2 text-slate-700 hover:text-white" title="${h.archived ? 'Restore' : 'Archive'}">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 8H3V6h18v2zm-2 1h-14v12h14V9zm-7 3h-2v2h2v-2z"/></svg>
                            </button>
                            <button onclick="openModal('addHabitModal', '${h.id}')" class="p-2 text-slate-700 hover:text-white"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            <button onclick="deleteHabit('${h.id}')" class="p-2 text-slate-700 hover:text-red-500"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6h14zM8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                        </div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-3xl text-center mb-6">
                        <p class="text-[8px] text-slate-600 uppercase font-black tracking-widest mb-1">${currentYear} Completed</p>
                        <p class="text-xl font-black text-white">${yearlyDone} Times</p>
                    </div>
                    <button onclick="toggleHabitLog('${h.id}')" class="w-full py-5 rounded-2xl border font-black text-xs uppercase tracking-widest ${isLogged ? 'bg-white text-black' : isScheduledToday ? 'border-white/10 text-slate-400 hover:border-white/30' : 'border-white/5 text-slate-800'} transition-all">
                        ${isLogged ? 'Active' : isScheduledToday ? 'Mark Done' : 'Off-Schedule'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function saveData() {
            localStorage.setItem('habitStats_v2_habits', JSON.stringify(habits));
            localStorage.setItem('habitStats_v2_logs', JSON.stringify(logs));
        }

        function toggleHabitLog(id) {
            const dp = document.getElementById('datePicker');
            if (!dp) return;
            const ds = dp.value.replace(/-/g, '/');
            if (!logs[ds]) logs[ds] = {};
            logs[ds][id] = !logs[ds][id];
            saveData();
            updateView();
        }

        function toggleHabitArchive(id) {
            const idx = habits.findIndex(h => h.id === id);
            if (idx !== -1) {
                habits[idx].archived = !habits[idx].archived;
                saveData();
                updateView();
            }
        }

        function saveHabit() {
            const name = document.getElementById('habitNameInput')?.value;
            const startDate = document.getElementById('habitStartDate')?.value;
            const editId = document.getElementById('editHabitId')?.value;
            if (!name || !startDate) return;
            if (editId) {
                const idx = habits.findIndex(h => h.id === editId);
                habits[idx] = { ...habits[idx], name, startDate, activeDays: [...selectedDays] };
            } else {
                habits.push({ id: Date.now().toString(), name, startDate, activeDays: [...selectedDays], archived: false });
            }
            saveData();
            updateView();
            closeModal('addHabitModal');
        }

        function deleteHabit(id) {
            customConfirm('Delete Habit', 'Are you sure you want to permanently delete this habit?', () => {
                habits = habits.filter(h => h.id !== id);
                saveData();
                updateView();
            });
        }

        function toggleArchiveView() {
            showArchived = !showArchived;
            const btn = document.getElementById('archiveToggleBtn');
            if (btn) btn.innerText = showArchived ? "Active" : "Archive";
            updateView();
        }

        function toggleDaySelection(dayIdx) {
            selectedDays = selectedDays.includes(dayIdx) ? selectedDays.filter(d => d !== dayIdx) : [...selectedDays, dayIdx];
            refreshDayButtons();
        }

        function refreshDayButtons() {
            dayLabels.forEach((_, idx) => {
                const btn = document.getElementById(`day-btn-${idx}`);
                if (btn) {
                    btn.className = selectedDays.includes(idx) 
                        ? "day-toggle px-4 py-2.5 rounded-xl border border-indigo-500/50 bg-indigo-500/10 text-indigo-400 text-[11px] font-black transition-all"
                        : "day-toggle px-4 py-2.5 rounded-xl border border-white/5 text-slate-600 text-[11px] font-black transition-all";
                }
            });
        }

        function openModal(id, extraId = null) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('hidden');

            if (id === 'addHabitModal') {
                const dateInput = document.getElementById('habitStartDate');
                const nameInput = document.getElementById('habitNameInput');
                const editIdInput = document.getElementById('editHabitId');
                const titleEl = document.getElementById('modalTitle');
                const saveBtn = document.getElementById('saveHabitBtn');
                if (extraId) {
                    const h = habits.find(h => h.id === extraId);
                    if (titleEl) titleEl.innerText = "Configure Habit";
                    if (nameInput) nameInput.value = h.name;
                    if (dateInput) dateInput.value = h.startDate;
                    if (editIdInput) editIdInput.value = h.id;
                    if (saveBtn) saveBtn.innerText = "Update";
                    selectedDays = [...h.activeDays];
                } else {
                    if (titleEl) titleEl.innerText = "New Habit";
                    if (nameInput) nameInput.value = "";
                    if (dateInput) dateInput.valueAsDate = new Date();
                    if (editIdInput) editIdInput.value = "";
                    if (saveBtn) saveBtn.innerText = "Create";
                    selectedDays = [0, 1, 2, 3, 4, 5, 6];
                }
                syncModalDateLabel();
                refreshDayButtons();
            } else if (id === 'addGoalModal') {
                const titleInput = document.getElementById('goalTitleInput');
                const descInput = document.getElementById('goalDescriptionInput');
                const catInput = document.getElementById('goalCategory');
                const editIdInput = document.getElementById('editGoalId');
                const saveBtn = document.getElementById('saveGoalBtn');
                const titleEl = document.getElementById('goalModalTitle');
                const catSelect = document.getElementById('goalCategorySelect');

                if (extraId) {
                    const goal = goals.find(g => g.id === extraId);
                    if (titleEl) titleEl.innerText = "Edit Objective";
                    if (titleInput) titleInput.value = goal.title;
                    if (descInput) descInput.value = goal.description || "";
                    if (catInput) catInput.value = goal.category || "";
                    if (catSelect) catSelect.value = ["Health", "Wealth", "Growth", "Social"].includes(goal.category) ? goal.category : "";
                    if (editIdInput) editIdInput.value = goal.id;
                    if (saveBtn) saveBtn.innerText = "Update Goal";
                } else {
                    if (titleEl) titleEl.innerText = "Yearly Objective";
                    if (titleInput) titleInput.value = "";
                    if (descInput) descInput.value = "";
                    if (catInput) catInput.value = "";
                    if (catSelect) catSelect.value = "";
                    if (editIdInput) editIdInput.value = "";
                    if (saveBtn) saveBtn.innerText = "Add Goal";
                }
            }
        }

        function closeModal(id) { 
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden'); 
        }

        function syncModalDateLabel() {
            const input = document.getElementById('habitStartDate');
            const display = document.getElementById('formattedStartDateDisplay');
            if (input && display && input.value) {
                const [y, m, d] = input.value.split('-');
                display.innerText = `${y}/${m}/${d}`;
            }
        }

        function downloadSelf() {
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Dashboard_Export_${new Date().toISOString().split('T')[0]}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- Goals Management ---
        function saveGoal() {
            const title = document.getElementById('goalTitleInput').value;
            const description = document.getElementById('goalDescriptionInput').value;
            const category = document.getElementById('goalCategory').value;
            const editId = document.getElementById('editGoalId').value;
            if (!title) return;

            if (editId) {
                goals = goals.map(g => g.id == editId ? { ...g, title, description, category } : g);
            } else {
                goals.push({ id: Date.now(), title, description, category, progress: 0, completed: false });
            }

            localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
            renderGoals();
            closeModal('addGoalModal');
        }

        function toggleGoalCompleted(id) {
            goals = goals.map(g => {
                if (g.id === id) {
                    const nextCompleted = !g.completed;
                    return { ...g, completed: nextCompleted, progress: nextCompleted ? 100 : 0 };
                }
                return g;
            });
            localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
            renderGoals();
        }

        function deleteGoal(id) {
            customConfirm('Delete Goal', 'Are you sure you want to permanently delete this goal?', () => {
                goals = goals.filter(g => g.id !== id);
                localStorage.setItem('habitStats_v2_goals', JSON.stringify(goals));
                renderGoals();
            });
        }

        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            if (!container) return;
            container.innerHTML = '';
            goals.forEach(goal => {
                const card = document.createElement('div');
                const isCompleted = goal.completed || false;
                card.className = `bg-amoled-card p-8 rounded-[2.5rem] border ${isCompleted ? 'border-indigo-500/50' : 'border-amoled'} shadow-2xl relative overflow-hidden group transition-all`;
                card.innerHTML = `
                    <div class="relative z-10 flex flex-col h-full justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">${goal.category || 'General'}</span>
                                <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="openModal('addGoalModal', ${goal.id})" class="text-slate-700 hover:text-white transition-all">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </button>
                                    <button onclick="deleteGoal(${goal.id})" class="text-slate-700 hover:text-red-500 transition-all">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                            </div>
                            <h3 class="text-2xl font-black ${isCompleted ? 'text-slate-500 line-through' : 'text-white'} leading-tight transition-all">${goal.title}</h3>
                            ${goal.description ? `<p class="text-sm font-medium mt-3 ${isCompleted ? 'text-slate-600 line-through' : 'text-slate-400'} leading-relaxed transition-all">${goal.description}</p>` : ''}
                        </div>
                        
                        <div class="pt-6">
                            <button onclick="toggleGoalCompleted(${goal.id})" class="w-full py-4 rounded-2xl border font-black text-xs uppercase tracking-widest ${isCompleted ? 'bg-white text-black border-white' : 'border-white/10 text-slate-400 hover:border-white/30'} transition-all flex items-center justify-center gap-2">
                                <div class="w-4 h-4 rounded border ${isCompleted ? 'bg-indigo-500 border-indigo-500' : 'border-white/20'} flex items-center justify-center">
                                    ${isCompleted ? '<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg>' : ''}
                                </div>
                                <span>${isCompleted ? 'Completed' : 'Mark Done'}</span>
                            </button>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        // --- Notes Management ---
        function openNoteModal(id = null) {
            const modalTitle = document.getElementById('noteModalTitle');
            const noteInput = document.getElementById('noteInput');
            const editId = document.getElementById('editNoteId');
            const saveBtn = document.getElementById('saveNoteBtn');
            
            if (id) {
                const note = notes.find(n => n.id === id);
                if (modalTitle) modalTitle.innerText = "Edit Note";
                if (noteInput) noteInput.value = note.text;
                if (editId) editId.value = note.id;
                if (saveBtn) saveBtn.innerText = "Update Note";
            } else {
                if (modalTitle) modalTitle.innerText = "New Note";
                if (noteInput) noteInput.value = "";
                if (editId) editId.value = "";
                if (saveBtn) saveBtn.innerText = "Save Note";
            }
            openModal('noteModal');
        }

        function saveNote() {
            const textInput = document.getElementById('noteInput');
            const editIdInput = document.getElementById('editNoteId');
            if (!textInput || !textInput.value.trim()) return;

            const text = textInput.value.trim();
            const editId = editIdInput.value;

            if (editId) {
                notes = notes.map(n => n.id == editId ? { ...n, text, timestamp: Date.now() } : n);
            } else {
                notes.push({ id: Date.now(), text, timestamp: Date.now() });
            }

            localStorage.setItem('habitStats_v2_notes', JSON.stringify(notes));
            renderNotes();
            closeModal('noteModal');
        }

        function deleteNote(id) {
            customConfirm('Delete Note', 'Are you sure you want to permanently delete this short note?', () => {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('habitStats_v2_notes', JSON.stringify(notes));
                renderNotes();
            });
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            if (!container) return;
            container.innerHTML = '';

            if (notes.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-700 border border-white/5 rounded-[2rem]">No notes yet. Click "+ Note" to add one!</div>`;
                return;
            }

            const sortedNotes = [...notes].sort((a, b) => b.timestamp - a.timestamp);

            sortedNotes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = "bg-amoled-card p-6 rounded-[2rem] border border-amoled shadow-xl flex flex-col justify-between group min-h-[140px] transition-all hover:border-white/10";
                noteCard.innerHTML = `
                    <div class="flex-1">
                        <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap select-text selection:bg-indigo-500 selection:text-white">${note.text}</p>
                    </div>
                    <div class="flex items-center justify-end mt-4 border-t border-white/5 pt-3">
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openNoteModal(${note.id})" class="p-1 hover:text-white text-slate-600 transition-colors" title="Edit Note">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onclick="deleteNote(${note.id})" class="p-1 hover:text-red-500 text-slate-600 transition-colors" title="Delete Note">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(noteCard);
            });
        }
    </script>
</body>
</html>
